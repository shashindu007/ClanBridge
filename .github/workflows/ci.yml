# Continuous integration — typecheck, lint, and the full offline suite.
#
# This runs on every push and pull request. Nothing here touches Supabase or
# Supercell: test/migrations.test.ts runs the migrations against PGlite (an
# in-process Postgres), and every sync test reads fixtures/. So this workflow
# needs NO secrets at all, which is the point — a CI job holding
# SUPABASE_SERVICE_KEY would be a second place for it to leak from (R6).
#
# USE_FIXTURES is deliberately NOT set here. The tests that need it set it
# themselves; leaving it unset means a test that quietly depends on the network
# fails loudly in CI instead of passing on the developer's machine only.

name: ci

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

# A new push supersedes the previous run on the same branch. Unlike the sync
# workflows, cancelling here loses nothing.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # The production build catches what typecheck and lint cannot: a Server
      # Action exported from the wrong kind of module, a client hook in a server
      # component, a page that fails to prerender. Without it those were first
      # found by Vercel, on deploy, after the commit was already on main.
      #
      # Placeholder Supabase values, NOT secrets: the build never contacts
      # Supabase (every data page is force-dynamic), but the clients refuse to
      # be constructed without a URL and a key, by design (lib/supabase/server.ts).
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
          NEXT_PUBLIC_SITE_URL: http://localhost:3000
          NEXT_TELEMETRY_DISABLED: "1"

      # Last, because it is by far the slowest step (~2 minutes, most of it
      # PGlite booting Postgres once per migration test). A type error should
      # not cost you the wait.
      - name: Test
        run: npm test
