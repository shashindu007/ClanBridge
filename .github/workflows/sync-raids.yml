# T7.2 — Capital raid weekend sync, and T7.4's Clan Games snapshot.
#
# R2 — sync runs here, never on Vercel.
#
# Repository secrets required (Settings -> Secrets and variables -> Actions):
#   COC_API_TOKEN         the PRODUCTION key, registered against the RoyaleAPI proxy IP
#   COC_API_BASE          https://cocproxy.royaleapi.dev/v1
#   SUPABASE_URL
#   SUPABASE_SERVICE_KEY
#
# R6 — none of these may ever be set as a Vercel environment variable.
#
# ─────────────────────────────────────────────────────────────────────────────
# RAIDS FORGIVE A MISSED RUN; CLAN GAMES DO NOT
#
# `/capitalraidseasons?limit=10` returns the last ten weekends complete on every
# call, so a missed raid run costs nothing — the next one backfills it.
#
# Clan Games is the opposite. The API publishes NO per-season score; T7.4
# derives it by differencing each player's "Games Champion" achievement between
# a snapshot at the start of the period and one at the end. Miss the start and
# that month cannot be reconstructed from anywhere. Hence a backup run on each
# boundary below. If Supercell ever moves the dates, the crons and
# src/lib/coc-time.ts move together.
#
# WHY CLAN GAMES IS A STEP HERE AND NOT ITS OWN WORKFLOW
#
# The same arithmetic T6.2 did for the war sync (see IMPLEMENTATION.md §0, and
# the long note in sync-clans.yml). A private repository has 2,000 Actions
# minutes a month, billed per run rounded up to the minute, and roughly 90% of a
# run's wall time is checkout + setup-node + `npm ci` rather than the work. With
# sync-clans hourly (~720), sync-health hourly (~720) and sync-cwl two-hourly
# (~360) already committed, a second daily workflow would pay for a whole
# checkout again to make a few dozen API calls. As a step it costs the calls and
# nothing else.
# ─────────────────────────────────────────────────────────────────────────────
#
# R10 — a "skipped" run is still normal: a manual run outside the weekend or
# the Games has nothing to collect. Not something to investigate.

name: sync-raids

# ─────────────────────────────────────────────────────────────────────────────
# ONLY ON THE DAYS SOMETHING HAPPENS
#
# This ran every day, and on most of them both steps skipped. Now each step runs
# only on its own days, told apart by `github.event.schedule` — the cron line
# that fired. A manual run (workflow_dispatch) runs both, as before.
#
# RAIDS — the weekend runs Friday 07:00 to Monday 07:00 UTC. Daily at 08:41 on
# Friday, Saturday, Sunday and Monday: Friday's is inside the new weekend, and
# Monday's lands after the close, so the finished weekend is stored final. A
# missed run still costs nothing — the API returns the last ten weekends on
# every call, and the next run backfills.
#
# CLAN GAMES — 22nd to 28th, 08:00 UTC (src/lib/coc-time.ts). The score is the
# "Games Champion" achievement at the end minus at the start, and a missed START
# is a lost month (clan-games.ts). So each boundary gets a run and a backup:
#   22nd 08:31, 22nd 10:31   start snapshot (the start phase lasts a day)
#   28th 08:41, 29th 10:41   end snapshot (any time after the close is fine)
# A second run on the same boundary writes nothing: the start is written once,
# and a settled month is never rewritten (027's settled_at).
#
# Do not assume punctual execution: GitHub delays scheduled runs by up to
# twenty minutes under load. services/freshness.ts knows this schedule, so the
# watchdog does not call Tuesday-to-Thursday "stale".
# ─────────────────────────────────────────────────────────────────────────────

on:
  schedule:
    - cron: "41 8 * * 5,6,0,1" # raids: Friday to Monday
    - cron: "31 8 22 * *"      # clan games: start
    - cron: "31 10 22 * *"     # clan games: start, backup
    - cron: "41 8 28 * *"      # clan games: end
    - cron: "41 10 29 * *"     # clan games: end, backup
  workflow_dispatch: # for a manual catch-up after a missed period boundary

concurrency:
  group: sync-raids
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    # Raids are one call per clan. Clan Games is one call per MEMBER, throttled
    # to one every 200 ms — roughly 50 members x 3 clans x 0.2s ≈ 30 seconds of
    # throttle alone, before retries. Ten minutes is ample and still bounded.
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Sync capital raid weekends
        if: github.event_name != 'schedule' || github.event.schedule == '41 8 * * 5,6,0,1'
        run: npm run sync:raids
        env:
          COC_API_TOKEN: ${{ secrets.COC_API_TOKEN }}
          COC_API_BASE: ${{ secrets.COC_API_BASE }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          # Explicitly false. Defaulting to fixtures in CI would make this job
          # report success every day while writing nothing real — a green tick
          # over an empty database, which is worse than a red one.
          USE_FIXTURES: "false"

      - name: Snapshot Clan Games achievement values
        # `always()`, so a raid failure does not cost the Clan Games snapshot.
        # These two share a workflow for billing reasons alone and have no
        # dependency on each other — and of the pair, this is the one whose
        # missed run is unrecoverable. Same argument as sync-clans.yml's war step.
        if: always() && (github.event_name != 'schedule' || github.event.schedule != '41 8 * * 5,6,0,1')
        run: npm run sync:clan-games
        env:
          COC_API_TOKEN: ${{ secrets.COC_API_TOKEN }}
          COC_API_BASE: ${{ secrets.COC_API_BASE }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          USE_FIXTURES: "false"
