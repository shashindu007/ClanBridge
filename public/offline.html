<!doctype html>
<html lang="en">
  <head>

    <title>Offline · ClanBridge</title>
    <style>
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 24px;
        box-sizing: border-box;
        background: #050d22;
        color: #e8ecf6;
        font-family: system-ui, sans-serif;
        text-align: center;
      }
      main {
        max-width: 28rem;
      }

        margin: 0 0 0.5rem;
      }
      p {
        color: #aab4cc;
        line-height: 1.5;
        margin: 0 0 1.5rem;
      }
      a {
        display: inline-block;
        padding: 0.7rem 1.25rem;
        border-radius: 8px;
        background: #e8b13a;
        color: #1a1305;
        font-weight: 600;
        text-decoration: none;
      }

  <body>
    <main>
      <h1>You are offline</h1>
      <p>ClanBridge needs a connection to show live war and clan data. Nothing you did was lost.</p>
